<svg xmlns="http://www.w3.org/2000/svg" width="512" height="512" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#16233D"/>
      <stop offset="1" stop-color="#0A1120"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFE29A"/>
      <stop offset="0.55" stop-color="#F5B942"/>
      <stop offset="1" stop-color="#C77F1A"/>
    </linearGradient>
    <linearGradient id="goldDark" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#F5B942"/>
      <stop offset="1" stop-color="#9A5F12"/>
    </linearGradient>
    <linearGradient id="gem" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#8FF5C6"/>
      <stop offset="1" stop-color="#1FA86B"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#FFD166" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#FFD166" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect x="0" y="0" width="512" height="512" rx="96" fill="url(#bg)"/>
  <rect x="0" y="0" width="512" height="512" rx="96" fill="none" stroke="#F5B942" stroke-opacity="0.35" stroke-width="6"/>

  <!-- stars -->
  <g fill="#FFFFFF" opacity="0.5">
    <circle cx="74" cy="96" r="4"/>
    <circle cx="438" cy="78" r="5"/>
    <circle cx="410" cy="150" r="3"/>
    <circle cx="102" cy="180" r="3"/>
    <circle cx="452" cy="250" r="4"/>
    <circle cx="60" cy="290" r="4"/>
  </g>

  <!-- glow behind tallest pillar -->
  <ellipse cx="256" cy="150" rx="150" ry="110" fill="url(#glow)"/>

  <!-- ground -->
  <rect x="56" y="400" width="400" height="10" rx="5" fill="#F5B942" opacity="0.85"/>
  <rect x="56" y="414" width="400" height="4" rx="2" fill="#F5B942" opacity="0.3"/>

  <!-- left pillar -->
  <g>
    <rect x="120" y="252" width="72" height="148" fill="url(#goldDark)"/>
    <rect x="120" y="252" width="14" height="148" fill="#FFE29A" opacity="0.7"/>
    <rect x="110" y="236" width="92" height="18" rx="4" fill="url(#gold)"/>
    <rect x="110" y="398" width="92" height="14" rx="4" fill="url(#gold)"/>
  </g>

  <!-- right pillar -->
  <g>
    <rect x="320" y="292" width="72" height="108" fill="url(#goldDark)"/>
    <rect x="320" y="292" width="14" height="108" fill="#FFE29A" opacity="0.7"/>
    <rect x="310" y="276" width="92" height="18" rx="4" fill="url(#gold)"/>
    <rect x="310" y="398" width="92" height="14" rx="4" fill="url(#gold)"/>
  </g>

  <!-- center pillar (tallest) -->
  <g>
    <rect x="220" y="172" width="72" height="228" fill="url(#gold)"/>
    <rect x="220" y="172" width="16" height="228" fill="#FFF3D1" opacity="0.8"/>
    <rect x="208" y="152" width="96" height="22" rx="5" fill="url(#gold)"/>
    <rect x="208" y="398" width="96" height="14" rx="4" fill="#C77F1A"/>
  </g>

  <!-- fortune gem above center pillar -->
  <g>
    <polygon points="256,62 296,102 256,142 216,102" fill="url(#gem)"/>
    <polygon points="256,62 296,102 256,102 216,102" fill="#CFFFE6" opacity="0.85"/>
    <polygon points="256,102 296,102 256,142" fill="#147A4D" opacity="0.55"/>
  </g>
</svg>
